<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caderno Ana Luisa Peretti (demo)</title>
<meta name="author" content="Pedro Peretti">
<meta name="description" content="Demonstração de um caderno de agenda, fotos e relatórios de obra para escritório de arquitetura.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#faf5ef">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caderno AL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:'Manrope';src:url(fonts/manrope-latin-wght-normal.woff2) format('woff2');font-weight:200 800;font-style:normal;font-display:swap}
@font-face{font-family:'Newsreader';src:url(fonts/newsreader-latin-wght-normal.woff2) format('woff2');font-weight:200 800;font-style:normal;font-display:swap}
/* Direção: aplicativo de celular, calmo e editorial. Papel creme, tinta ameixa, títulos em serifa fina, topo em arco (a forma da arquitetura), barra de navegação flutuante. */
:root{
  --paper:#faf5ef;
  --card:#fffdfa;
  --ink:#56323e;
  --muted:#826c6e;
  --tint:#f0e3da;
  --line:#e7dad2;
  --accent:#efd2b5;
  --rose:#bd796a;
  --hero:#f3dfd3;
  --sage:#dfe6cf;
  --sage-ink:#4b5a2d;
  --warm-ink:#765446;
  --bad:#9b263b;
  --bad-bg:#f6dcd6;
  --serif:'Newsreader',Georgia,'Times New Roman',serif;
  --sans:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#e7dad3;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;transition:background .2s,transform .15s}
button:active{transform:scale(.98)}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid #3869dc;outline-offset:3px}
p{margin:0;line-height:1.55}
h1,h2,h3{margin:0;font-weight:450}
h1{font-family:var(--serif);font-size:37px;line-height:1.04;letter-spacing:-1.3px;text-wrap:balance}
h2{font-family:var(--serif);font-size:25px;font-weight:500;letter-spacing:-.8px;line-height:1.15}
h3{font-size:15px;font-weight:650;letter-spacing:-.02em}
svg{display:block;flex-shrink:0}
.app{max-width:430px;min-height:100dvh;margin:auto;position:relative;overflow:hidden;background:var(--paper);padding-bottom:112px}
@media(min-width:600px){body{padding:28px 0}.app{min-height:844px;box-shadow:0 25px 100px #00000024;border-radius:38px}}
.head{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 22px 0}
.brand{font-family:var(--serif);font-size:27px;font-weight:450;letter-spacing:-1.2px;line-height:1}
.brand small{display:block;font-family:var(--sans);font-size:9px;letter-spacing:2px;font-weight:700;color:var(--muted);margin-top:4px}
.iconbtn{width:44px;height:44px;display:grid;place-items:center;border-radius:50%}
.avatar{width:38px;height:38px;display:grid;place-items:center;background:var(--tint);border-radius:50%;font-size:12px;font-weight:700}
.content{padding:14px 22px 20px;animation:appear .22s ease-out}
@keyframes appear{from{opacity:.6;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.eyebrow{font-size:10px;letter-spacing:1.5px;font-weight:700;text-transform:uppercase}
.muted{color:var(--muted)}
.small{font-size:13px}
.micro{font-size:11px;line-height:1.5}
.center{text-align:center}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mt{margin-top:24px}.mt16{margin-top:16px}.mt8{margin-top:8px}
.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:26px 0 6px}
.card{border-radius:24px;padding:20px;background:var(--card);border:1px solid var(--line)}
.softcard{border-radius:24px;padding:18px;background:#ecdfd6}
.stack{display:grid;gap:14px}
.primary,.secondary{min-height:52px;width:100%;padding:13px 20px;border-radius:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:650;font-size:14px}
.primary{background:var(--ink);color:var(--paper)}
.secondary{background:var(--tint);color:var(--ink)}
.textbtn{min-height:44px;font-size:12px;font-weight:650;padding:8px;color:var(--ink)}
.textbtn.danger{color:var(--bad)}
.textbtn.armed{background:var(--bad);color:#fff;border-radius:14px;padding:8px 14px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:7px 10px;border-radius:99px;background:var(--tint);font-weight:700;letter-spacing:.2px;white-space:nowrap}
.pill.st-agendada{background:var(--tint);color:var(--ink)}
.pill.st-andamento{background:var(--accent);color:var(--warm-ink)}
.pill.st-concluida{background:var(--sage);color:var(--sage-ink)}
.pill.st-cancelada{background:#e8e2dd;color:var(--muted)}
.pill.late{background:var(--bad-bg);color:var(--bad)}
.pill.flag{background:var(--bad-bg);color:var(--bad)}
.pill.sm{padding:4px 8px;font-size:9px}
.dot{width:8px;height:8px;border-radius:50%;background:#6fae8c;display:inline-block}
.dot.saving{background:#d9a35a}.dot.err{background:#c4565f}.dot.demo{background:var(--rose)}

/* arco do dia */
.hero{position:relative;min-height:236px;background:var(--hero);border-radius:120px 120px 24px 24px;padding:30px 20px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden}
.hero .art{position:absolute;inset:0;width:100%;height:100%;color:var(--rose)}
.hero .inner{position:relative}
.hero .big{font-family:var(--serif);font-size:72px;letter-spacing:-4px;line-height:1;margin:2px 0}
.hero .pill{position:relative;margin-top:14px;background:#faf5efbb;font-size:9px;max-width:100%;overflow:hidden;text-overflow:ellipsis}

/* semana e calendário */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.week button{display:grid;justify-items:center;gap:6px;padding:9px 2px;min-height:62px;border-radius:20px;font-size:13px;font-weight:600}
.week button small{font-size:9px;opacity:.7;font-weight:600}
.week button i{height:4px;width:4px;border-radius:50%;background:currentColor;opacity:.55}
.week button i.none{opacity:0}
.week button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dl{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding:6px 0}
.cal button{height:42px;border-radius:50%;font-size:13px;font-weight:600;position:relative}
.cal button .d{position:absolute;bottom:5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor;opacity:.55}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.seg{display:flex;background:var(--tint);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:10px;font-size:12px;font-weight:600;padding:0 4px}
.seg button[aria-pressed=true]{background:var(--paper);box-shadow:0 2px 4px #0000000a}
.seg.status button[aria-pressed=true][data-k=andamento]{background:var(--accent)}
.seg.status button[aria-pressed=true][data-k=concluida]{background:var(--sage);color:var(--sage-ink)}

/* linhas e campos */
.lineitem{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-bottom:1px solid var(--line);padding:13px 0;min-height:68px}
.lineitem:last-child{border-bottom:0}
.lineitem .meta{flex:1;min-width:0}
.lineitem strong{font-size:14px;font-weight:650;display:block}
.lineitem p{font-size:12px;color:var(--muted);margin-top:3px}
.archimg{position:relative;border-radius:120px 120px 24px 24px;overflow:hidden;background:var(--tint);aspect-ratio:1/1.08}
.archimg img{width:100%;height:100%;object-fit:cover;display:block}
.archimg .cap{position:absolute;left:12px;right:12px;bottom:12px;background:#faf5efe8;backdrop-filter:blur(8px);border-radius:18px;padding:10px 16px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.archimg .cap b{font-family:var(--serif);font-size:30px;font-weight:500;letter-spacing:-1px;line-height:1}
.proj .cover{display:block;width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px;margin:-4px 0 14px;background:var(--tint)}
.ph .src{position:absolute;top:8px;left:8px;background:var(--paper);color:var(--ink)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumbs button{padding:0;border-radius:16px;overflow:hidden;background:var(--tint);aspect-ratio:1}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.sig{text-align:center;font-size:10px;letter-spacing:2.4px;color:var(--muted);opacity:.75;font-weight:600;padding:4px 0 0}
.lmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.symbol{width:42px;height:42px;display:grid;place-items:center;background:var(--tint);border-radius:15px;flex-shrink:0}
.side{display:grid;justify-items:end;gap:6px;flex-shrink:0}
.field{display:grid;gap:7px;font-size:12px;font-weight:650}
.field input,.field select,.field textarea{width:100%;min-height:52px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.field textarea{min-height:96px;resize:vertical;line-height:1.5}
.fgrid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.fgrid .full{grid-column:1/-1}
.note{display:flex;gap:9px;border-radius:15px;background:var(--tint);padding:13px;font-size:12px;line-height:1.55}
.progress{height:5px;border-radius:8px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink);border-radius:8px}
.optrow{display:flex;gap:12px;align-items:flex-start;padding:15px 0;border-bottom:1px solid var(--line);font-size:14px}
.optrow:last-of-type{border-bottom:0}
.optrow input{width:22px;height:22px;accent-color:var(--ink);margin:1px 0 0;flex-shrink:0}
.optrow .tx.done{color:var(--muted);text-decoration:line-through}
.optrow small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.optrow .x{margin-left:auto;font-size:20px;color:var(--muted);padding:0 6px;line-height:1}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.addrow .secondary{width:auto;min-height:48px}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ph{position:relative;border-radius:18px;overflow:hidden;background:var(--tint);text-align:left;display:block;padding:0}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.ph .cp{display:block;padding:8px 10px 10px;font-size:11px;line-height:1.4}
.ph .nn{position:absolute;top:8px;left:8px;background:var(--ink);color:var(--paper);font-size:10px;font-weight:700;padding:3px 8px;border-radius:99px}
.ph .pd{position:absolute;top:8px;right:8px}
.timeline{border-left:1px solid #d4bfb2;margin:14px 0 0 12px;padding-left:22px}
.timeline>div{padding:0 0 18px;position:relative}
.timeline>div:before{content:'';width:9px;height:9px;position:absolute;left:-27px;top:5px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 4px var(--paper)}
.timeline time{font-size:10px;color:var(--muted);letter-spacing:.5px;font-weight:600;display:block}
.timeline span{font-size:13px}
.proj{display:block;width:100%;text-align:left;padding:20px;border-radius:24px;background:var(--card);border:1px solid var(--line);margin-top:12px}
.proj h2{font-size:23px;margin:6px 0 2px}

/* barra flutuante */
.nav{position:fixed;z-index:8;bottom:16px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:398px;display:flex;justify-content:space-around;gap:4px;padding:7px;border-radius:25px;background:color-mix(in srgb,var(--paper) 93%,transparent);border:1px solid var(--line);box-shadow:0 8px 40px #5632421a;backdrop-filter:blur(18px)}
.nav button{flex:1;min-height:52px;padding:6px 2px;display:grid;justify-items:center;gap:4px;border-radius:19px;color:var(--muted);font-size:10px;font-weight:650}
.nav button[aria-current=page]{background:var(--ink);color:var(--paper)}
@media(min-width:600px){.nav{bottom:44px}}

/* modal e aviso */
.ovl{position:fixed;inset:0;background:rgba(86,50,62,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;overflow:auto}
@media(min-width:600px){.ovl{align-items:center;padding:24px}}
.modal{background:var(--paper);width:100%;max-width:430px;border-radius:28px 28px 0 0;padding:20px 22px 22px;max-height:94dvh;overflow:auto;animation:appear .2s ease-out}
.modal.wide{max-width:560px}
@media(min-width:600px){.modal{border-radius:28px}}
.modal>header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.pv img{display:block;width:100%;max-height:50vh;object-fit:contain;border-radius:16px;background:var(--tint)}
canvas.ann{display:block;width:100%;height:auto;touch-action:none;border-radius:16px;background:var(--tint)}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools button{min-height:36px;padding:6px 12px;border-radius:99px;background:var(--tint);font-size:12px;font-weight:650}
.tools button[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:15px;font-size:12px;z-index:80;max-width:90vw}
.toast.err{background:var(--bad)}
.empty{border:1px dashed #d4bfb2;border-radius:20px;padding:26px 16px;text-align:center;color:var(--muted);margin-top:12px}

/* relatório */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 20px}
.sheet h2{font-size:27px;margin:6px 0 4px}
.sheet h3{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:6px;margin:24px 0 10px}
.sheet dl{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin:14px 0 0;font-size:13px}
.sheet dt{color:var(--muted)}.sheet dd{margin:0}
.sheet figure{margin:0 0 14px}
.sheet figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:14px;background:var(--tint)}
.sheet figcaption{font-size:12px;margin-top:6px;line-height:1.45}
.rline{font-size:13px;padding:4px 0;line-height:1.5}
@media(prefers-reduced-motion:reduce){*,*:after{animation:none!important;transition:none!important}}
</style>
<script src="vendor/jspdf.umd.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <div class="head">
    <div class="brand">Ana Luisa Peretti<small>ARQUITETURA</small></div>
    <div class="row" style="gap:8px"><span class="pill sm" id="sync" role="status"><i class="dot"></i><span>Carregando</span></span><div class="avatar">AL</div></div>
  </div>
  <div id="root"></div>
  <div class="sig">Pedro Peretti</div>
  <nav class="nav" id="nav" aria-label="Navegação principal"></nav>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';

/* ---------- utilidades ---------- */
function h(tag,p){
  var e=document.createElement(tag),late=null;p=p||{};
  for(var k in p){var v=p[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='pressed'||k==='current'){(late=late||{})[k]=v;}
    else e.setAttribute(k,v===true?'':v);
  }
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  if(late){if('value' in late)e.value=late.value;if('checked' in late)e.checked=!!late.checked;if('disabled' in late)e.disabled=!!late.disabled;
    if('pressed' in late)e.setAttribute('aria-pressed',late.pressed?'true':'false');if(late.current)e.setAttribute('aria-current','page');}
  return e;
}
function add(e,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(e,x)});}else if(c.nodeType){e.appendChild(c);}else e.appendChild(document.createTextNode(String(c)))}
function clr(e){while(e.firstChild)e.removeChild(e.firstChild);return e}
function $(id){return document.getElementById(id)}
function clone(o){return JSON.parse(JSON.stringify(o))}
function canon(v){if(Array.isArray(v))return '['+v.map(canon).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().map(function(k){return JSON.stringify(k)+':'+canon(v[k])}).join(',')+'}';return JSON.stringify(v)}
function pad(n,l){n=String(n);while(n.length<(l||2))n='0'+n;return n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parse(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function hoje(){return iso(new Date())}
var WD=['dom','seg','ter','qua','qui','sex','sáb'],WDL=['domingo','segunda-feira','terça-feira','quarta-feira','quinta-feira','sexta-feira','sábado'];
var MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
var INIC=['D','S','T','Q','Q','S','S'];
function fmtD(s){if(!s)return '';var p=s.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function fmtDT(t){if(!t)return '';var d=new Date(t);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+' '+pad(d.getHours())+':'+pad(d.getMinutes())}
function nowIso(){return new Date().toISOString()}
function newId(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function fmt(v,d){return (+v||0).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})}
function brl(v){return (+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0})}
function osCode(o){return 'OS-'+pad(o.n||0,4)}
function dateOf(o){return o.rel!=null?addDays(hoje(),o.rel):(o.data||hoje())}

/* ---------- ícones ---------- */
var P={home:'M3 10 12 3l9 7v10H3Z M9 20v-7h6v7',calendar:'M4 5h16v16H4ZM8 2v6m8-6v6M4 11h16',folder:'M3 6h6l2 2h10v11H3Z',user:'M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0M4 21a8 8 0 0 1 16 0',
  plus:'M12 4v16M4 12h16',check:'m5 12 4 4L19 6',back:'M19 12H5m5-5-5 5 5 5',arrow:'M5 12h14m-5-5 5 5-5 5',camera:'M4 8h4l2-3h4l2 3h4v12H4ZM12 11a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7',
  image:'M3 5h18v14H3ZM3 16l5-5 4 4 3-3 6 6',file:'M6 3h9l4 4v14H6ZM14 3v5h5M9 13h6M9 17h6',pin:'M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11ZM12 7a3 3 0 1 0 0 6 3 3 0 0 0 0-6',
  search:'M16 16l5 5M3 10a7 7 0 1 0 14 0 7 7 0 0 0-14 0',sofa:'M4 12V9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v3M3 12h18v5H3ZM5 17v2m14-2v2',building:'M5 21V4h9v17M14 9h5v12M8 8h3M8 12h3M8 16h3',
  dots:'M5 12h1m6 0h1m6 0h1',chevron:'m9 5 7 7-7 7',left:'m15 5-7 7 7 7',close:'m5 5 14 14M5 19 19 5'};
function icon(n,s){s=s||20;var d=document.createElement('span');d.style.display='contents';
  d.innerHTML='<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(P[n]||P.dots)+'"/></svg>';return d.firstChild}

/* ---------- constantes do escritório ---------- */
var TIPOS={avaliacao:'Avaliação de imóvel antes da compra',consultoria:'Consultoria de ambientes',visita:'Visita técnica',reuniao:'Reunião com cliente',obra:'Visita de obra',entrega:'Entrega de etapa',outro:'Outro'};
var TIPO_IC={avaliacao:'search',consultoria:'sofa',visita:'pin',reuniao:'user',obra:'building',entrega:'file',outro:'dots'};

/* ---------- sincronização ---------- */
function setSync(k,msg){
  var s=$('sync'),dot=s.querySelector('i');dot.className='dot'+(k==='saving'?' saving':k==='err'?' err':k==='demo'?' demo':'');
  s.lastChild.textContent={ok:'Sincronizado',saving:'Salvando',err:msg||'Erro ao salvar',demo:'Demonstração',load:'Carregando'}[k]||k;
}
function pending(path){var w=Q[path];return !!(w&&(w.t||w.run))}
function persist(path,data,now){
  if(S.demo||!CAP.db){localSave();setSync('demo');return}
  if(S.ro)return;
  var w=Q[path]||(Q[path]={t:null,run:false,again:false,data:null});
  w.data=clone(data);clearTimeout(w.t);setSync('saving');
  w.t=setTimeout(function(){w.t=null;flush(path)},now?0:400);
}
async function flush(path){
  var w=Q[path];if(w.run){w.again=true;return}
  w.run=true;
  try{await CAP.db.doc(path).set(w.data);if(!w.again&&!w.t)setSync('ok')}
  catch(e){
    if(e&&e.code==='invalid_argument'){S.demo=true;localSave();setSync('demo');render()}
    else setSync('err',e&&e.code==='quota_exceeded'?'Limite de armazenamento':'Erro ao salvar');
  }
  w.run=false;if(w.again){w.again=false;flush(path)}
}
async function removeDoc(path){

async function startDb(){

    try{
      var a=await CAP.db.collection('ordens').get(),b=await CAP.db.collection('projetos').get(),o={},p={};
      a.docs.forEach(function(d){o[d.id]=clone(d.data())});b.docs.forEach(function(d){p[d.id]=clone(d.data())});
      startDemo({ordens:o,projs:p});

  }
  var seeded=false;try{var m=await CAP.db.doc('meta/demo').get();seeded=m.exists}catch(e){}

    if(!seeded&&!Object.keys(S.ordens).length&&!Object.keys(S.projs).length){seedDb();return}
    setSync('ok');render();

  function fail(){clearTimeout(timer);setSync('err','Sem acesso aos dados');startDemo(null)}

    if(S.demo||S.seeding)return;

    S.ordens=m;okO=true;

  },fail);
  CAP.db.collection('projetos').onSnapshot(function(snap){
    if(S.demo||S.seeding)return;
    var m={},ch=false;snap.docs.forEach(function(d){var cur=S.projs[d.id];
